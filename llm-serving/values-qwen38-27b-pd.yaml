routerSpec:
  repository: lmcache/lmstack-router
  tag: v0.1.13
  routingLogic: disaggregated_prefill_orchestrated
  extraArgs:
  - --prefill-model-labels
  - qwen38-prefill
  - --decode-model-labels
  - qwen38-decode
  hf_token: ""
  sessionKey: x-user-id
  lmcacheControllerPort: 9000
  lmcacheControllerReplyPort: 9001
  lmcacheControllerHeartbeatPort: 9002
  strategy:
    type: Recreate
  resources:
    requests:
      cpu: "4"
      memory: 16G
    limits:
      cpu: "4"
      memory: 16G
  startupProbe:
    failureThreshold: 60
    httpGet:
      path: /health
      port: router-port
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
  livenessProbe:
    failureThreshold: 6
    httpGet:
      path: /health
      port: router-port
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5

servingEngineSpec:
  runtimeClassName: ""
  strategy:
    type: Recreate
  startupProbe:
    failureThreshold: 120
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 60
    periodSeconds: 30
  modelSpec:
  - name: qwen38-prefill
    repository: lmcache/vllm-openai
    tag: v0.5.6rc5-amd64
    modelURL: Qwen/Qwen3.8-27B-FP8
    replicaCount: 4
    requestCPU: 8
    requestMemory: 128Gi
    requestGPU: 1
    pvcStorage:
      emptyDir:
        sizeLimit: 200Gi
    vllmConfig:
      enablePrefixCaching: true
      maxModelLen: 32768
      gpuMemoryUtilization: "0.9"
    lmcacheConfig:
      enabled: false
      enablePD: true
    env:
    - name: VLLM_LOGGING_LEVEL
      value: DEBUG
    - name: VLLM_SSM_CONV_STATE_LAYOUT
      value: DS
    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
      value: "5600"
    - name: UCX_NET_DEVICES
      value: all
    command:
    - /bin/sh
    - -c
    - |
      set -e
      /opt/venv/bin/lmcache server \
        --host localhost --port 5555 \
        --chunk-size 784 --separate-object-groups \
        --l1-size-gb 60 --eviction-policy LRU &
      until /opt/venv/bin/python -c "import socket; socket.create_connection(('localhost', 5555), 1)" 2>/dev/null; do
        echo "waiting for lmcache server on :5555"; sleep 2
      done
      exec /opt/venv/bin/vllm serve Qwen/Qwen3.8-27B-FP8 \
        --host 0.0.0.0 --port 8000 \
        --max-model-len 32768 --dtype auto --gpu-memory-utilization 0.9 \
        --enable-prefix-caching --mamba-cache-mode align \
        --max-num-batched-tokens 1567 \
        --kv-transfer-config '{"kv_connector":"MultiConnector","kv_role":"kv_producer","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"},{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"tcp://localhost","lmcache.mp.port":5555}}]}}'
  - name: qwen38-decode
    repository: lmcache/vllm-openai
    tag: v0.5.6rc5-amd64
    modelURL: Qwen/Qwen3.8-27B-FP8
    replicaCount: 4
    requestCPU: 8
    requestMemory: 128Gi
    requestGPU: 1
    pvcStorage:
      emptyDir:
        sizeLimit: 200Gi
    vllmConfig:
      enablePrefixCaching: true
      maxModelLen: 32768
      gpuMemoryUtilization: "0.9"
    lmcacheConfig:
      enabled: false
      enablePD: true
    env:
    - name: VLLM_LOGGING_LEVEL
      value: DEBUG
    - name: VLLM_SSM_CONV_STATE_LAYOUT
      value: DS
    - name: VLLM_NIXL_SIDE_CHANNEL_HOST
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: VLLM_NIXL_SIDE_CHANNEL_PORT
      value: "5600"
    - name: UCX_NET_DEVICES
      value: all
    command:
    - /bin/sh
    - -c
    - |
      set -e
      /opt/venv/bin/lmcache server \
        --host localhost --port 5555 \
        --chunk-size 784 --separate-object-groups \
        --l1-size-gb 60 --eviction-policy LRU &
      until /opt/venv/bin/python -c "import socket; socket.create_connection(('localhost', 5555), 1)" 2>/dev/null; do
        echo "waiting for lmcache server on :5555"; sleep 2
      done
      exec /opt/venv/bin/vllm serve Qwen/Qwen3.8-27B-FP8 \
        --host 0.0.0.0 --port 8000 \
        --max-model-len 32768 --dtype auto --gpu-memory-utilization 0.9 \
        --enable-prefix-caching --mamba-cache-mode align \
        --max-num-batched-tokens 1567 \
        --kv-transfer-config '{"kv_connector":"MultiConnector","kv_role":"kv_consumer","kv_connector_extra_config":{"connectors":[{"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"},{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"tcp://localhost","lmcache.mp.port":5555}}]}}'

